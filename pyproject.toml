[project]
name = "rag-paper"
version = "0.1.0"
description = "Environment for the RAG paper project"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.0",
    "langchain-openai>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "faiss-cpu>=1.13.2",
    "gradio>=6.0.1",
    "matplotlib>=3.10.0",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.1",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.7.0",
]

[tool.uv]
package = false
